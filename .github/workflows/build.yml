name: Build Firmware CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
      - 'pico_sdk_import.cmake'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
      - 'pico_sdk_import.cmake'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi build-essential libnewlib-arm-none-eabi git

      - name: Setup Pico SDK Manually
        run: |
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk
          git submodule update --init
          echo "PICO_SDK_PATH=/opt/pico-sdk" >> $GITHUB_ENV

      - name: Create Dummy secrets.h for Build Test
        run: |
          mkdir -p include
          echo '#ifndef SECRETS_H' > include/secrets.h
          echo '#define SECRETS_H' >> include/secrets.h
          echo '#define WIFI_SSID "CI_WIFI"' >> include/secrets.h
          echo '#define WIFI_PASSWORD "CI_PASSWORD"' >> include/secrets.h
          echo '#define MQTT_BROKER_IP "127.0.0.1"' >> include/secrets.h
          echo '#endif' >> include/secrets.h

      - name: Configure CMake
        run: |
          cmake -B build -DPICO_BOARD=pico_w -DPICO_SDK_PATH=/opt/pico-sdk .

      - name: Compile Firmware
        run: |
          cmake --build build -j$(nproc)

      - name: Upload Artifact (.uf2)
        uses: actions/upload-artifact@v4
        with:
          name: pico-mqtt-firmware
          path: build/*.uf2
